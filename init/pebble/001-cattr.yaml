summary: Cattr runtime services

description: |
  Process plan for both the all-in-one Docker image and role-based deployments.
  Services are disabled by default; cattr-entrypoint explicitly starts the
  requested role set.

services:
  app:
    override: replace
    summary: Laravel Octane application server
    # Pebble does not expand environment variables in a command, hence the
    # shell wrapper; exec keeps PHP as the process Pebble supervises.
    #
    # OCTANE_WORKERS / OCTANE_TASK_WORKERS default to "auto", which is one
    # worker per CPU core: adding cores to the host scales the application
    # without touching this file. Set a number only to cap or raise it, for
    # example OCTANE_WORKERS=2 on a many-core host with little memory (budget
    # roughly 100-150 MB of RAM per worker).
    #
    # OCTANE_MAX_REQUESTS recycles a worker after that many requests, which
    # bounds slow memory growth. Lower it if workers grow too large between
    # restarts.
    command: >-
      sh -c 'exec php artisan octane:start --host=0.0.0.0 --port=8090
      --workers="${OCTANE_WORKERS:-auto}"
      --task-workers="${OCTANE_TASK_WORKERS:-auto}"
      --max-requests="${OCTANE_MAX_REQUESTS:-500}"'
    startup: disabled
    working-dir: /opt/cattr/app
    on-success: restart
    on-failure: shutdown
    kill-delay: 30s

  caddy:
    override: replace
    summary: Cattr Caddy reverse proxy and static file server
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    environment:
      XDG_CONFIG_HOME: /tmp/caddy/config
      XDG_DATA_HOME: /tmp/caddy/data
    startup: disabled
    requires:
      - app
    after:
      - app
    on-success: restart
    on-failure: shutdown
    kill-delay: 10s

  queue:
    override: replace
    summary: Laravel queue worker
    command: php artisan queue:work --sleep=3 --no-interaction
    startup: disabled
    working-dir: /opt/cattr/app
    on-success: restart
    on-failure: restart
    backoff-delay: 1s
    backoff-limit: 30s
    kill-delay: 30s

  reverb:
    override: replace
    summary: Laravel Reverb WebSocket server
    command: php artisan reverb:start --host=0.0.0.0 --port=8081
    startup: disabled
    working-dir: /opt/cattr/app
    on-success: restart
    on-failure: restart
    backoff-delay: 1s
    backoff-limit: 30s
    kill-delay: 30s

  scheduler:
    override: replace
    summary: Laravel scheduler trigger
    command: /usr/bin/supercronic /opt/cattr/crontab
    startup: disabled
    working-dir: /opt/cattr/app
    on-success: restart
    on-failure: restart
    backoff-delay: 1s
    backoff-limit: 30s
    kill-delay: 10s
