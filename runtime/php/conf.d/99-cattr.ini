post_max_size = 512M
upload_max_filesize = 512M

; Per-process limit, so one heavy request or job (large report export) cannot
; exhaust the host. The container entrypoint derives PHP_MEMORY_LIMIT from the
; memory available to the container, so it follows the host size on its own;
; set PHP_MEMORY_LIMIT explicitly to override, or to -1 for no limit.
; The fallback only applies when PHP starts without that variable, for example
; through `docker exec`.
memory_limit = ${PHP_MEMORY_LIMIT:-512M}
